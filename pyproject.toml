[project]
name = "uri-gatherer"
version = "0.1.0"
description = "A web crawler that recursively discovers and collects unique URIs from HTML pages"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.13.3",
    "requests>=2.32.3",
]

[project.scripts]
uri-gatherer = "gatherer.__main__:main"

[dependency-groups]
dev = [
    "poethepoet>=0.32.2",
]

test = [
    "pytest>=8.3.4",
    "pyhamcrest>=2.1.0",
    "pytest-cov>=6.0.0",
]

lint = [
    "mypy>=1.15.0",
    "pylint>=3.3.4",
    "ruff>=0.9.7",
    "types-beautifulsoup4>=4.12.0.20250204",
    "types-requests>=2.32.0.20241016",
]

docs = [
    "pdoc>=15.0.1",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that make live network requests",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.poe.tasks]
test = "pytest --cov --cov-report term-missing -m 'not integration'"
fulltest = "pytest --cov --cov-report term-missing"

_imports = "ruff check --select I --fix ."
_format = "ruff format ."
format.sequence = ["_imports", "_format"]

_type = "mypy gatherer/"
_check = "ruff check ."
_lint = "pylint gatherer/"
lint.sequence = ["_type", "_check", "_lint"]

docs = "pdoc -t pdoc/ -o docs/ --docformat google gatherer/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gatherer/"]
